name: Build and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore SubtitleEdit.sln

    - name: Build Subtitle Edit
      run: msbuild SubtitleEdit.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Prepare Artifacts
      run: |
        mkdir artifacts
        $releaseDir = "src\ui\bin\Release\net48"
        if (!(Test-Path $releaseDir)) { $releaseDir = "src\ui\bin\Release" }
        Write-Host "Using release directory: $releaseDir"
        
        # Copy binaries
        Get-ChildItem $releaseDir -Recurse -Include *.exe, *.dll, *.config | ForEach-Object {
            copy $_.FullName artifacts\
        }
        
        # Copy required data folders
        $folders = @("Icons", "Dictionaries", "Ocr", "Tesseract302")
        foreach ($folder in $folders) {
            if (Test-Path $folder) {
                Write-Host "Copying folder: $folder"
                xcopy $folder artifacts\$folder\ /E /I /Y
            }
        }
        
        dir artifacts
      shell: powershell

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SubtitleEdit-Build
        path: artifacts/
